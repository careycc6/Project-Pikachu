<!DOCTYPE html>
<html>
<head>
<title>Pokemon Showdown Battle Viewer</title>
<style>
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
  h1 { color: #f9c74f; text-align: center; }
  .battle { display: flex; justify-content: space-between; gap: 20px; margin: 20px 0; }
  .card { background: #16213e; border-radius: 10px; padding: 20px; flex: 1; }
  .card h2 { color: #90e0ef; margin-bottom: 10px; }
  .hp-bar { background: #333; border-radius: 5px; height: 12px; margin: 5px 0; overflow: hidden; }
  .hp-fill { height: 100%; border-radius: 5px; transition: width 0.5s; }
  .move { background: #0f3460; border-radius: 8px; padding: 8px 12px; margin: 5px 0; font-size: 14px; }
  .type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 5px; font-weight: bold; }
  .switch-pill { background: #533483; border-radius: 20px; padding: 4px 10px; font-size: 12px; display: inline-block; margin: 3px; }
  .status { text-align: center; color: #90e0ef; margin: 10px 0; }
  button { background: #f9c74f; color: #1a1a2e; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
  .step-counter { text-align: center; font-size: 24px; color: #f9c74f; margin: 10px 0; }
</style>
</head>
<body>
<h1>Pokemon Showdown Battle Viewer</h1>
<div class="status" id="status">Not connected</div>
<div style="text-align:center">
  <button onclick="fetchState()">Refresh</button>
  <button onclick="toggleAuto()" id="auto-btn">Auto Refresh</button>
</div>
<div class="step-counter">Turn: <span id="turn">0</span></div>
<div class="battle">
  <div class="card">
    <h2>Your Pokemon</h2>
    <div id="your-content">Waiting for battle...</div>
  </div>
  <div class="card">
    <h2>Opponent</h2>
    <div id="opp-content">Waiting for battle...</div>
  </div>
</div>
<div class="card" style="margin-top:20px">
  <h2>Available Moves</h2>
  <div id="moves-content">Waiting for battle...</div>
</div>
<div class="card" style="margin-top:20px">
  <h2>Available Switches</h2>
  <div id="switches-content">Waiting for battle...</div>
</div>
<script>
const TYPE_COLORS = {fire:'#e8603c',water:'#4a90d9',grass:'#5aab4b',electric:'#f5c518',psychic:'#e8518a',ice:'#74cec0',dragon:'#6060e8',dark:'#5a5272',fairy:'#e9a8e9',normal:'#a8a878',fighting:'#c03028',poison:'#a040a0',ground:'#e0c068',flying:'#a890f0',bug:'#a8b820',rock:'#b8a038',ghost:'#705898',steel:'#b8b8d0'};
let autoTimer = null;
function hpColor(f){return f>0.5?'#4caf50':f>0.25?'#ff9800':'#f44336';}
function render(state){
  if(!state)return;
  document.getElementById('turn').textContent=window._step||0;
  const hp=Math.round((state.active_hp||0)*100);
  const ohp=Math.round((state.opponent_hp||0)*100);
  document.getElementById('your-content').innerHTML=`<b>${state.active_pokemon||'?'}</b><div class="hp-bar"><div class="hp-fill" style="width:${hp}%;background:${hpColor(state.active_hp||0)}"></div></div><small>${hp}% HP</small>`;
  document.getElementById('opp-content').innerHTML=`<b>${state.opponent_pokemon||'?'}</b><div class="hp-bar"><div class="hp-fill" style="width:${ohp}%;background:${hpColor(state.opponent_hp||0)}"></div></div><small>${ohp}% HP</small>`;
  document.getElementById('moves-content').innerHTML=(state.active_moves||[]).map((m,i)=>`<div class="move">${i+1}. <b>${m.id||'?'}</b> <span class="type" style="background:${TYPE_COLORS[m.type?.toLowerCase()]||'#888'}">${m.type||'?'}</span>${m.base_power?m.base_power+' BP':'status'}</div>`).join('');
  document.getElementById('switches-content').innerHTML=(state.available_switches||[]).map(s=>`<span class="switch-pill">${s}</span>`).join('')||'No switches available';
}
async function fetchState(){
  try{
    await fetch('http://localhost:8765/health');
    document.getElementById('status').textContent='Connected to adapter';
    const r=await fetch('http://localhost:8765/state').catch(()=>null);
    if(r&&r.ok){const d=await r.json();window._step=d.step||window._step||0;render(d.observation||d);}
    else{document.getElementById('status').textContent='Adapter running - waiting for battle';}
  }catch(e){document.getElementById('status').textContent='Adapter not running - start python adapter.py';}
}
function toggleAuto(){
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;document.getElementById('auto-btn').textContent='Auto Refresh';}
  else{autoTimer=setInterval(fetchState,3000);document.getElementById('auto-btn').textContent='Stop Auto';fetchState();}
}
fetchState();
</script>
</body>
</html>
